name: Colmena PR builds
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: ['automation/update']
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      sha:
        description: Exact PR head SHA
        required: true
jobs:
  build:
    runs-on: nixos
    timeout-minutes: 360
    env:
      FORGEJO_URL: https://git.gindin.xyz
      FORGEJO_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
      PR_NUMBER: ${{ inputs.pr }}
      COMMIT_SHA: ${{ inputs.sha }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build every host and retain closures
        run: python3 scripts/forgejo/build.py
      - name: Report unexpected build failure
        if: failure()
        run: python3 scripts/forgejo/build-failure.py
      - name: Notify the repair controller
        if: always()
        run: python3 scripts/forgejo/notify.py
      - name: Remove job checkout
        if: always()
        run: git clean -ffdx
